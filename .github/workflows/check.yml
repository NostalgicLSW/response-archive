name: Validate archive
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag snapshot
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5 tag snapshot
        with:
          python-version: '3.12'
      - run: python -B tools/check_release.py --tracked
      - run: python -B evals/run.py --label ci
      - run: python -B tools/package.py
      - run: python -B evals/release_eval.py
